<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="favicon-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B1B32"/>
      <stop offset="100%" stopColor="#060C18"/>
    </linearGradient>
    <mask id="favicon-cloud-mask">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <path d="M10 49 C22 46 34 38 46 24 L40 18 L62 12 L54 34 L48 28 C36 40 23 47 10 49 Z" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#favicon-bg)"/>
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Official Cloud Emblem scaled to 48x36 inside squircle -->
  <g transform="translate(-1, 3)">
    <!-- 1. Bottom-Right Cyan Accent Lobe -->
    <path d="M26 49 C32 49 44 49 49 49 C57 49 63 42.5 63 35 C63 28 58 22.3 51.5 21.5 C44.5 29.5 35 38.5 19 45.5 C21.5 47.8 23.8 49 26 49 Z" fill="#00A3E0"/>

    <!-- 2. Main White Cloud Body with Mask Cutout -->
    <path d="M16 49 C8 49 1.5 42.5 1.5 35 C1.5 28 6.5 22.3 13.5 21.2 C15.5 12.5 23 6 32 6 C42 6 50 13.5 51.5 23.5 C54 22.8 56.5 22.5 59.5 22.5 C60.8 22.5 62 22.7 63 23 C60.5 26.5 57 31 50.5 36.5 C40.5 45 28 49 16 49 Z" 
          fill="#FFFFFF" 
          mask="url(#favicon-cloud-mask)"/>

    <!-- 3. Ascending Blue Arrow -->
    <path d="M12 47 C20.5 44.5 30 38 40 26 L36.5 22.5 L55 14.5 L46.5 32.5 L43 29 C33 39 23 44.5 12 47 Z" fill="#00A3E0"/>
  </g>
</svg>